name: Native builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macOS-universal
          - os: windows-2022
            platform: Windows-x64
          - os: ubuntu-24.04
            platform: Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev xvfb
      - name: Configure Mac universal
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
      - name: Configure Windows / Linux
        if: runner.os != 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build -C Release --output-on-failure
      - name: Test Mac / Windows
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Render interface preview
        if: runner.os == 'Linux'
        run: xvfb-run -a build/LowlineTests_artefacts/Release/LowlineTests --screenshot
      - name: Upload interface preview
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Lowline-interface-preview
          if-no-files-found: error
          retention-days: 30
          path: |
            lowline-preview.png
            lowline-help-preview.png
            lowline-tools-preview.png
            lowline-midi-preview.png
            lowline-workspace-*.png
      - name: Verify Mac architectures and package
        if: runner.os == 'macOS'
        run: |
          lipo build/Lowline_artefacts/Release/Standalone/Lowline.app/Contents/MacOS/Lowline -archs
          lipo build/Lowline_artefacts/Release/Standalone/Lowline.app/Contents/MacOS/Lowline -verify_arch arm64 x86_64
          mkdir -p package/Lowline
          cp -R build/Lowline_artefacts/Release/Standalone build/Lowline_artefacts/Release/VST3 build/Lowline_artefacts/Release/AU package/Lowline/
          cp packaging/Install-Lowline.command packaging/README-INSTALL.txt package/Lowline/
          chmod +x package/Lowline/Install-Lowline.command
          ditto -c -k --sequesterRsrc --keepParent package/Lowline Lowline-macOS-universal.zip
          hdiutil create -volname "Lowline 0.3" -srcfolder package/Lowline -ov -format UDZO Lowline-macOS-universal.dmg
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/Lowline_artefacts/Release/Standalone,build/Lowline_artefacts/Release/VST3,packaging/README-INSTALL.txt -DestinationPath Lowline-Windows-x64.zip
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cp packaging/README-INSTALL.txt build/Lowline_artefacts/Release/
          tar -C build/Lowline_artefacts/Release -czf Lowline-Linux-x64.tar.gz Standalone VST3 README-INSTALL.txt
      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: Lowline-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 30
          path: |
            Lowline-macOS-universal.zip
            Lowline-macOS-universal.dmg
            Lowline-Windows-x64.zip
            Lowline-Linux-x64.tar.gz
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.platform }}
          if-no-files-found: ignore
          retention-days: 14
          path: build/Testing/Temporary/*.log

  release:
    name: Publish 0.3.0 downloads
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Lowline-*
          merge-multiple: true
          path: packages
      - name: Publish tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.3.0 >/dev/null 2>&1; then
            echo 'Version 0.3.0 already exists; never overwrite a published version.'
            exit 0
          fi
          cd packages
          sha256sum Lowline-macOS-universal.zip Lowline-macOS-universal.dmg Lowline-Windows-x64.zip Lowline-Linux-x64.tar.gz > SHA256SUMS.txt
          cat > notes.md <<'NOTES'
          ## Lowline 0.3.0 — Bass workspace
          **Scarica / Download:** choose your system under **Assets**, not Source code.
          - macOS universal: DMG or ZIP, Apple Silicon + Intel, standalone / AU / VST3. Installation helper included. Not Developer-ID signed or notarised.
          - Windows x64 ZIP: standalone / VST3.
          - Linux x64 tar.gz: standalone / VST3 (Ubuntu 24.04-compatible libraries).

          New: searchable library, favourites and recent files; A/B snapshots and measured RMS matching; backing player with offline pitch-preserving speed adjustment, looping and accented metronome; dual DI/FX float-WAV recording; preset details and control undo/redo; stage view; grouped capture preparation and room tail carry-over; guided audio diagnostics and update link.

          [Guida italiana](https://github.com/MassimoDanieli/lowline/blob/main/docs/HELP_IT.md) · [English guide](https://github.com/MassimoDanieli/lowline/blob/main/docs/HELP_EN.md) · [Validation and limits](https://github.com/MassimoDanieli/lowline/blob/main/VALIDATION.md)

          All three native build/test jobs must succeed before this release is published. Hardware listening, actual interface latency and Apple notarisation are not certified by these tests. No NAM captures or IRs are bundled.
          NOTES
          gh release create v0.3.0 --target "$SOURCE_SHA" --title 'Lowline 0.3.0 — Bass workspace' --notes-file notes.md --draft
          gh release upload v0.3.0 Lowline-macOS-universal.zip Lowline-macOS-universal.dmg Lowline-Windows-x64.zip Lowline-Linux-x64.tar.gz SHA256SUMS.txt
          gh release edit v0.3.0 --draft=false --latest
