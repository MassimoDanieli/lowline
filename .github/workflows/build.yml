name: Native builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  # Never cancel main: a cancelled run could stop between creating the draft release and publishing it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    name: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macOS-universal
          - os: windows-2022
            platform: Windows-x64
          - os: ubuntu-24.04
            platform: Linux-x64
    runs-on: ${{ matrix.os }}
    env:
      # Signing runs only when all Apple secrets exist (never on forks / pull requests from forks).
      MAC_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev xvfb
      - name: Configure Mac universal
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
      - name: Configure Windows / Linux
        if: runner.os != 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build -C Release --output-on-failure
      - name: Test Mac / Windows
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate VST3 (pluginval, strictness 10)
        shell: bash
        run: |
          set -euo pipefail
          curl -sSLo pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_${{ runner.os }}.zip"
          mkdir -p pluginval && cd pluginval && cmake -E tar xf ../pluginval.zip && cd ..
          case "${{ runner.os }}" in
            Linux) run="xvfb-run -a pluginval/pluginval" ;;
            macOS) run="pluginval/pluginval.app/Contents/MacOS/pluginval" ;;
            Windows) run="pluginval/pluginval.exe" ;;
          esac
          $run --strictness-level 10 --validate-in-process --output-dir pluginval-logs \
            --validate "build/Lowline_artefacts/Release/VST3/Radice.vst3"
      - name: Validate AU (auval)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Lowline_artefacts/Release/AU/Radice.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          triple=$(auval -a | awk '/MsDn/ && /LwLn/ {print $1" "$2" "$3; exit}')
          echo "Audio Unit: $triple"
          test -n "$triple"
          auval -v $triple
      - name: Render interface preview
        if: runner.os == 'Linux'
        run: xvfb-run -a build/LowlineTests_artefacts/Release/LowlineTests --screenshot
      - name: Upload interface preview
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Radice-interface-preview
          if-no-files-found: error
          retention-days: 30
          path: |
            lowline-preview.png
            lowline-help-preview.png
            lowline-tools-preview.png
            lowline-midi-preview.png
            lowline-workspace-*.png
      - name: Verify Mac architectures and assemble package
        if: runner.os == 'macOS'
        run: |
          lipo build/Lowline_artefacts/Release/Standalone/Radice.app/Contents/MacOS/Radice -archs
          lipo build/Lowline_artefacts/Release/Standalone/Radice.app/Contents/MacOS/Radice -verify_arch arm64 x86_64
          mkdir -p package/Radice
          cp -R build/Lowline_artefacts/Release/Standalone build/Lowline_artefacts/Release/VST3 build/Lowline_artefacts/Release/AU package/Radice/
          cp packaging/Install-Radice.command packaging/README-INSTALL.txt package/Radice/
          chmod +x package/Radice/Install-Radice.command
      - name: Sign and notarise Mac bundles (Developer ID)
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/lowline-signing.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          test -n "$identity" || { echo 'No "Developer ID Application" identity in MACOS_CERTIFICATE_P12'; exit 1; }
          xcrun notarytool store-credentials lowline-ci --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
          echo "LOWLINE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "LOWLINE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "LOWLINE_NOTARY_PROFILE=lowline-ci" >> "$GITHUB_ENV"
          LOWLINE_SIGN_IDENTITY="$identity" LOWLINE_NOTARY_PROFILE=lowline-ci LOWLINE_KEYCHAIN="$keychain" \
            scripts/sign-mac.sh package/Radice
      - name: Create Mac archives
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^project\(Lowline VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          ditto -c -k --sequesterRsrc --keepParent package/Radice Radice-macOS-universal.zip
          hdiutil create -volname "Radice $version" -srcfolder package/Radice -ov -format UDZO Radice-macOS-universal.dmg
          if [[ "$MAC_SIGNING" == true ]]; then
            codesign --force --timestamp --sign "$LOWLINE_SIGN_IDENTITY" Radice-macOS-universal.dmg
            xcrun notarytool submit Radice-macOS-universal.dmg --keychain-profile "$LOWLINE_NOTARY_PROFILE" \
              --keychain "$LOWLINE_KEYCHAIN" --wait
            xcrun stapler staple Radice-macOS-universal.dmg
            spctl --assess --type open --context context:primary-signature -vv Radice-macOS-universal.dmg
          fi
      - name: Remove signing keychain
        if: always() && runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/lowline-signing.keychain-db" || true
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/Lowline_artefacts/Release/Standalone,build/Lowline_artefacts/Release/VST3,packaging/README-INSTALL.txt -DestinationPath Radice-Windows-x64.zip
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cp packaging/README-INSTALL.txt build/Lowline_artefacts/Release/
          tar -C build/Lowline_artefacts/Release -czf Radice-Linux-x64.tar.gz Standalone VST3 README-INSTALL.txt
      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: Radice-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 30
          path: |
            Radice-macOS-universal.zip
            Radice-macOS-universal.dmg
            Radice-Windows-x64.zip
            Radice-Linux-x64.tar.gz
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.platform }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/Testing/Temporary/*.log
            pluginval-logs/**

  ios:
    name: iOS (iPad/iPhone app + AUv3) compile check
    timeout-minutes: 60
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure Xcode project for iOS
        run: cmake -S . -B build-ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DLOWLINE_BUILD_NUMBER=${{ github.run_number }}
      - name: Build app and AUv3 for devices (unsigned)
        run: |
          xcodebuild -quiet -project build-ios/Lowline.xcodeproj -target Lowline_AUv3 -target Lowline_Standalone \
            -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build
      - name: Check the app bundle
        run: |
          set -euo pipefail
          # JUCE writes products to Lowline_artefacts/<config>/Standalone (no "-iphoneos" suffix).
          app=$(find build-ios -name 'Radice.app' -type d -not -path '*.build/*' -print -quit)
          if [[ -z "$app" ]]; then
            echo 'Radice.app not found; bundles produced:'
            find build-ios \( -name '*.app' -o -name '*.appex' \) -type d -not -path '*.build/*'
            exit 1
          fi
          echo "App: $app"
          ls "$app/PlugIns" || echo 'Warning: no embedded AUv3 found in PlugIns'
          # iOS 27 refuses to launch apps built with its SDK that do not use the UIScene life cycle.
          /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest' "$app/Info.plist" \
            || { echo 'UIApplicationSceneManifest missing: the app would not launch on iOS 27'; exit 1; }
          # App Store Connect rejects uploads without a privacy manifest in the app and the extension.
          test -f "$app/PrivacyInfo.xcprivacy" || { echo 'PrivacyInfo.xcprivacy missing from the app'; exit 1; }
          for ext in "$app"/PlugIns/*.appex; do
            test -f "$ext/PrivacyInfo.xcprivacy" || { echo "PrivacyInfo.xcprivacy missing from $ext"; exit 1; }
          done
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist"
          lipo -info "$app/Radice"

  release:
    name: Publish downloads for the CMake version
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MAC_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/download-artifact@v4
        with:
          pattern: Radice-*
          merge-multiple: true
          path: packages
      - name: Publish tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # The version comes from project(Lowline VERSION x.y.z) in CMakeLists.txt: bump it to publish.
          VERSION=$(sed -nE 's/^project\(Lowline VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' source/CMakeLists.txt)
          test -n "$VERSION"
          TAG="v$VERSION"
          if [[ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || true)" == true ]]; then
            # A draft left by an interrupted run is not public: replace it instead of blocking the version.
            gh release delete "$TAG" --yes
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "Version $VERSION already exists; never overwrite a published version. Bump CMakeLists.txt to release."
            exit 0
          fi
          # Publish only when the user-facing documents describe this version, so a version bump
          # in CMakeLists.txt during development does not ship with the previous version's docs.
          STALE=""
          V="${VERSION//./\\.}" # dots are literal in the patterns below
          head -n 1 source/README.md | grep -q "^# Radice $V\b" || STALE="$STALE README.md"
          head -n 1 source/LEGGIMI.md | grep -q "^# Radice $V\b" || STALE="$STALE LEGGIMI.md"
          head -n 1 source/VALIDATION.md | grep -q "Radice $V\b" || STALE="$STALE VALIDATION.md"
          grep -qE "^# ((Lowline|Radice) )?$VERSION([^0-9.]|$)" source/CHANGELOG.md || STALE="$STALE CHANGELOG.md"
          if [[ -n "$STALE" ]]; then
            echo "::warning::Not publishing $TAG: these files do not describe version $VERSION yet:$STALE"
            echo "Release $TAG not published: update$STALE to $VERSION first." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Release notes: the CHANGELOG section of this version (from its heading to the next one).
          CHANGES=$(awk -v v="$VERSION" '
            /^# / { if (found) exit; if ($0 ~ "^# ((Lowline|Radice) )?" v "([^0-9.]|$)") { found = 1; next } }
            found { print }' source/CHANGELOG.md)
          cd packages
          sha256sum Radice-macOS-universal.zip Radice-macOS-universal.dmg Radice-Windows-x64.zip Radice-Linux-x64.tar.gz > SHA256SUMS.txt
          {
            echo "## Radice $VERSION"
            echo '**Scarica / Download:** choose your system under **Assets**, not Source code.'
            if [[ "$MAC_SIGNING" == true ]]; then
              echo '- macOS universal: DMG or ZIP, Apple Silicon + Intel, standalone / AU / VST3. Developer-ID signed and notarised by Apple.'
            else
              echo '- macOS universal: DMG or ZIP, Apple Silicon + Intel, standalone / AU / VST3. Installation helper included. Not Developer-ID signed or notarised.'
            fi
            echo '- Windows x64 ZIP: standalone / VST3.'
            echo '- Linux x64 tar.gz: standalone / VST3 (Ubuntu 24.04-compatible libraries).'
            echo
            echo "$CHANGES"
            echo
            echo 'Every build passes the regression tests, pluginval (strictness 10) on all three systems and auval on macOS.'
            echo
            echo '[Guida italiana](https://github.com/MassimoDanieli/radice/blob/main/docs/HELP_IT.md) · [English guide](https://github.com/MassimoDanieli/radice/blob/main/docs/HELP_EN.md) · [Validation and limits](https://github.com/MassimoDanieli/radice/blob/main/VALIDATION.md)'
            echo
            echo 'All three native build/test jobs must succeed before this release is published. Hardware listening and actual interface latency are not certified by these tests. No NAM captures or IRs are bundled.'
          } > notes.md
          gh release create "$TAG" --target "$SOURCE_SHA" --title "Radice $VERSION" --notes-file notes.md --draft
          gh release upload "$TAG" Radice-macOS-universal.zip Radice-macOS-universal.dmg Radice-Windows-x64.zip Radice-Linux-x64.tar.gz SHA256SUMS.txt
          gh release edit "$TAG" --draft=false --latest
