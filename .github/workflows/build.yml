name: Native builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macOS-universal
          - os: windows-2022
            platform: Windows-x64
          - os: ubuntu-24.04
            platform: Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev xvfb
      - name: Configure Mac universal
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
      - name: Configure Windows / Linux
        if: runner.os != 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build -C Release --output-on-failure
      - name: Test Mac / Windows
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify Mac architectures and package
        if: runner.os == 'macOS'
        run: |
          lipo -verify_arch arm64 x86_64 build/Lowline_artefacts/Release/Standalone/Lowline.app/Contents/MacOS/Lowline
          mkdir -p package/Lowline
          cp -R build/Lowline_artefacts/Release/Standalone build/Lowline_artefacts/Release/VST3 build/Lowline_artefacts/Release/AU package/Lowline/
          ditto -c -k --sequesterRsrc --keepParent package/Lowline Lowline-macOS-universal.zip
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/Lowline_artefacts/Release/Standalone,build/Lowline_artefacts/Release/VST3 -DestinationPath Lowline-Windows-x64.zip
      - name: Package Linux
        if: runner.os == 'Linux'
        run: tar -C build/Lowline_artefacts/Release -czf Lowline-Linux-x64.tar.gz Standalone VST3
      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: Lowline-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 30
          path: |
            Lowline-macOS-universal.zip
            Lowline-Windows-x64.zip
            Lowline-Linux-x64.tar.gz
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.platform }}
          if-no-files-found: ignore
          retention-days: 14
          path: build/Testing/Temporary/*.log
